<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConectaServiços | Entrar</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<header class="site-header">
  <div class="nav-container">
    <a class="logo" href="index.html">📞 Conecta<strong>Serviços</strong></a>
    <ul class="nav-links">
      <li><a class="nav-link" href="index.html">Início</a></li>
      <li><a class="nav-link" href="busca.html">Buscar Serviços</a></li>
      <li><a class="nav-link" href="historico.html">Meu Histórico</a></li>
      <li><a class="nav-link" href="perfil.html">Área do Prestador</a></li>
    </ul>
    <div class="auth-actions" id="authArea"></div>
    <button class="nav-toggle" id="navToggle">☰</button>
  </div>
</header>

<main class="page">
  <div class="auth-box">
    <h1>Entrar na conta</h1>
    <form id="loginForm">
      <label>E-mail</label>
      <input type="email" id="loginEmail" required placeholder="seuemail@exemplo.com">
      <label>Senha</label>
      <input type="password" id="loginPassword" required placeholder="••••••••">
      <button type="submit" class="btn btn-accent btn-block" style="margin-top:16px;">Entrar</button>
      <p class="form-msg" id="loginMsg"></p>
    </form>
    <p class="auth-switch">Não tem conta? <a class="link-btn" href="cadastro.html">Cadastre-se</a></p>
  </div>
</main>

<footer class="site-footer">
  <p>ConectaServiços — Projeto de Extensão Universitária | IFSUL</p>
  <p class="note">Plataforma apenas de divulgação de serviços. Não intermediamos pagamentos.</p>
</footer>

<script src="js/main.js"></script>
</body>
</html>
