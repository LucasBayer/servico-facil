<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConectaServiços | Cadastrar</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<header class="site-header">
  <div class="nav-container">
    <a class="logo" href="index.html">📞 Conecta<strong>Serviços</strong></a>
    <ul class="nav-links">
      <li><a class="nav-link" href="index.html">Início</a></li>
      <li><a class="nav-link" href="busca.html">Buscar Serviços</a></li>
      <li><a class="nav-link" href="historico.html">Meu Histórico</a></li>
      <li><a class="nav-link" href="perfil.html">Área do Prestador</a></li>
    </ul>
    <div class="auth-actions" id="authArea"></div>
    <button class="nav-toggle" id="navToggle">☰</button>
  </div>
</header>

<main class="page">
  <div class="auth-box">
    <h1>Criar conta</h1>
    <form id="registerForm">
      <label>Eu sou:</label>
      <div class="radio-row">
        <label class="radio-option"><input type="radio" name="tipoConta" value="cliente" checked> Cliente</label>
        <label class="radio-option"><input type="radio" name="tipoConta" value="prestador"> Prestador de Serviço</label>
      </div>

      <label>Nome completo</label>
      <input type="text" id="regNome" required placeholder="Seu nome">

      <label>Cidade</label>
      <select id="regCidade" required>
        <option value="">Selecione</option>
        <option>Camaquã</option>
        <option>Sentinela do Sul</option>
        <option>Tapes</option>
        <option>Sertão Santana</option>
      </select>

      <label>E-mail</label>
      <input type="email" id="regEmail" required placeholder="seuemail@exemplo.com">

      <label>Telefone / WhatsApp</label>
      <input type="tel" id="regTelefone" required placeholder="(51) 9xxxx-xxxx">

      <label>Senha</label>
      <input type="password" id="regSenha" required placeholder="••••••••">

      <button type="submit" class="btn btn-accent btn-block" style="margin-top:16px;">Cadastrar</button>
      <p class="form-msg" id="regMsg"></p>
    </form>
    <p class="auth-switch">Já tem conta? <a class="link-btn" href="login.html">Entrar</a></p>
  </div>
</main>

<footer class="site-footer">
  <p>ConectaServiços — Projeto de Extensão Universitária | IFSUL</p>
  <p class="note">Plataforma apenas de divulgação de serviços. Não intermediamos pagamentos.</p>
</footer>

<script src="js/main.js"></script>
</body>
</html>
